name: Build and Release

# Builds on master, PRs, tags, and manual runs.
# GitHub Releases are created only for tags matching v*.*.* (e.g. v0.7.1).
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          RELEASE_NAME="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  build-linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Meson wraps and ccache
        uses: actions/cache@v4
        with:
          path: |
            subprojects/packagecache
            subprojects/fltk
            .ccache
          key: meson-linux-${{ hashFiles('subprojects/*.wrap') }}-${{ github.sha }}
          restore-keys: |
            meson-linux-${{ hashFiles('subprojects/*.wrap') }}-
            meson-linux-

      # Do not install distro FLTK: meson.build will then build 1.4.4 from
      # subprojects/fltk.wrap (needed for native file dialogs).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake ninja-build meson pkg-config git python3 \
            libgl-dev libglu1-mesa-dev libpng-dev zlib1g-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libfontconfig1-dev

      - name: Build and package
        env:
          CC: ccache gcc
          CXX: ccache g++
        run: |
          ./build_scripts/build-linux.sh --skip-dep-install --buildtype release
          ccache -s || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: burrtools-linux
          path: burrtools-${{ needs.version.outputs.version }}-linux-*.tar.gz
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Meson wraps
        uses: actions/cache@v4
        with:
          path: |
            subprojects/packagecache
            subprojects/fltk
          key: meson-mingw-${{ hashFiles('subprojects/*.wrap') }}-${{ github.sha }}
          restore-keys: |
            meson-mingw-${{ hashFiles('subprojects/*.wrap') }}-
            meson-mingw-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build cmake mingw-w64 pkg-config zip

      - name: Build
        run: |
          meson setup build-win --cross-file cross-mingw64.txt --buildtype=release
          meson compile -C build-win
          x86_64-w64-mingw32-strip build-win/burrtools.exe build-win/burrTxt.exe build-win/burrTxt2.exe

      - name: Package Windows binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          STAGE=$(mktemp -d)
          DEST="$STAGE/burrtools"
          mkdir -p "$DEST"
          cp build-win/burrtools.exe build-win/burrTxt.exe build-win/burrTxt2.exe "$DEST/"
          cp -R examples "$DEST/examples"
          cp README.md COPYING "$DEST/"
          ARCHIVE="burrtools-${VERSION}-windows-x86_64.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/$ARCHIVE" burrtools)
          rm -rf "$STAGE"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: burrtools-windows
          path: burrtools-${{ needs.version.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error

  build-macos:
    needs: version
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Meson wraps and ccache
        uses: actions/cache@v4
        with:
          path: |
            subprojects/packagecache
            subprojects/fltk
            .ccache
          key: meson-macos-${{ hashFiles('subprojects/*.wrap') }}-${{ github.sha }}
          restore-keys: |
            meson-macos-${{ hashFiles('subprojects/*.wrap') }}-
            meson-macos-

      - name: Build
        env:
          CC: ccache clang
          CXX: ccache clang++
        run: |
          brew install ccache meson ninja cmake pkg-config libpng
          export PATH="$(brew --prefix)/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          ./build_scripts/build-macos.sh --skip-dep-install --buildtype release
          strip -x build/burrtools build/burrTxt build/burrTxt2
          ccache -s || true

      - name: Create macOS app bundle and DMG
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./build_scripts/create-macos-bundle.sh "$VERSION"
          test -f "BurrTools-${VERSION}.dmg"

      - name: Package macOS CLI tools
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ARCH=$(uname -m)
          STAGE=$(mktemp -d)
          cp build/burrTxt build/burrTxt2 README.md COPYING "$STAGE/"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/burrtools-${VERSION}-macos-${ARCH}-cli.zip" .)
          rm -rf "$STAGE"
          mkdir -p artifacts
          mv "BurrTools-${VERSION}.dmg" "burrtools-${VERSION}-macos-${ARCH}-cli.zip" artifacts/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: burrtools-macos
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [version, build-linux, build-windows, build-macos]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        run: |
          awk '/^-{5,}/{if(++count==1)next; if(count==2)exit} count==1' NEWS > notes.md
          {
            echo
            echo "## Downloads"
            echo
            echo "See the Assets section below for platform-specific downloads."
            echo
            echo "- Linux x86_64: \`burrtools-*-linux-*.tar.gz\`"
            echo "- Windows x86_64: \`burrtools-*-windows-x86_64.zip\`"
            echo "- macOS Apple Silicon: \`BurrTools-*.dmg\` (GUI) and \`burrtools-*-macos-*-cli.zip\` (command-line tools)"
          } >> notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: BurrTools ${{ needs.version.outputs.release_name }}
          body_path: notes.md
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
